# ============================================================
#  THE CANDID DUO — site configuration
#  Lines marked  # << CHANGE  are the only ones you need to edit.
# ============================================================

title: The Candid Duo
# Shown nowhere on the page: it completes the homepage's Google title ("The Candid Duo | …").
tagline: Travel Guides & Family Stories
# Also printed in the footer.
description: >-
  Unscripted travel stories, vlogs and podcasts from two wanderers —
  Jeju, New Zealand, Tasmania, Umroh and everywhere in between.
author: The Candid Duo       # more details for search engines in _data/authors.yml
# The logo search engines show for the site and as the stories' publisher.
logo: /assets/images/uploads/1789569997436-the-candid-duo-logo.png

# Your live web address. This is our own domain (the CNAME file next to this
# one tells GitHub Pages about it; thecandidduo.github.io now redirects here).
# If your repo is named  <username>.github.io  keep baseurl empty (recommended).
# If it's a normal repo (e.g. "blog"), set baseurl to "/blog".
url: "https://thecandidduo.com"        # << CHANGE  (your web address)
baseurl: ""                            # << CHANGE only if using a project repo

# ---- Build settings (leave as-is) ----
markdown: kramdown
permalink: /stories/:title/
timezone: Asia/Singapore
theme: null                            # this site is fully custom-designed; don't use GitHub Pages' default theme

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed

# ---- Monetisation: Google AdSense ----
# Turn 'enabled' to true AFTER AdSense approves your site,
# then paste your publisher ID and (optionally) ad unit slot IDs.
adsense:
  enabled: true                        # << CHANGE to true once approved
  publisher_id: "ca-pub-4194453206974732"   # << CHANGE (from AdSense)
  slot_leaderboard: ""                 # << optional ad unit slot ID
  slot_infeed: ""                      # << optional
  slot_inarticle: ""                   # << optional

# ---- Analytics (optional) ----
google_analytics: ""                   # e.g. "G-XXXXXXXXXX"
# Cookie-free page-view counter that feeds the CMS Dashboard (SETUP-GUIDE, Step 6g).
# This is your CMS worker's address; set it to "" to switch counting off.
stats_url: "https://candidduo-cms-auth.thecandiduo2.workers.dev"

# ---- Social / contact (also editable in the CMS) ----
social:
  instagram: "https://instagram.com/thecandidduo"
  tiktok: "https://tiktok.com/@thecandidduo"
  youtube: "https://youtube.com/@thecandidduo"
  spotify: ""
  email: "thecandiduo2@gmail.com"      # << CHANGE

# ---- Feed ----
feed:
  path: feed.xml

# ---- Collections ----
collections:
  products:
    output: false      # products link out to shops; no individual pages needed
  digital_products:
    output: false      # our own printables, sold on Gumroad/Etsy; also link out

# ---- Defaults ----
defaults:
  - scope: { path: "", type: "posts" }
    values: { layout: "post" }
  # The CMS is noindex, so keep it out of sitemap.xml too (otherwise Search
  # Console flags "Submitted URL marked 'noindex'").
  - scope: { path: "admin" }
    values: { sitemap: false }
  # Search Console ownership files (keep them — deleting one un-verifies the site).
  - scope: { path: "google*.html" }
    values: { sitemap: false }
  # Share image (link previews, Google) for pages that don't set their own `image:`. Only story
  # pages display `image` on the page itself, so this changes nothing visible. Set here rather
  # than in the files because the CMS page editor drops front matter keys it doesn't know.
  - scope: { path: "", type: "pages" }
    values: { image: /assets/images/hero-brand.jpg }
  - scope: { path: "about.md" }
    values: { image: /assets/images/uploads/1790933277627-img_5330.jpg }

# ---- Files Jekyll should ignore ----
exclude:
  - README.md
  - SETUP-GUIDE.md
  - GO-LIVE-CHECKLIST.md
  - CLAUDE.md
  - oauth-worker
  - admin/editor-src   # build source for the visual editor (only admin/lib/editor.bundle.js ships)
  - Gemfile
  - Gemfile.lock
  - vendor
  - .sass-cache
  - node_modules
