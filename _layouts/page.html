---
layout: default
---
<div class="wrap page-hero">
  {% if page.eyebrow %}<span class="eyebrow">{{ page.eyebrow }}</span>{% endif %}
  <h1>{{ page.title }}</h1>
  {% if page.lead %}<p class="lead">{{ page.lead }}</p>{% endif %}
</div>
<div class="section" style="padding-top:clamp(1.5rem,3vw,2.5rem)">
  <div class="wrap prose">
    {{ content }}
  </div>
</div>
{% if page.url == "/contact/" %}{% include socials.html %}{% endif %}
