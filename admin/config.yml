# ============================================================
#  DECAP CMS CONFIG
#  Edit the three lines marked  # << CHANGE  after you deploy.
#  Full walkthrough is in SETUP-GUIDE.md (Step 6).
# ============================================================

backend:
  name: github
  repo: thecandidduo/thecandidduo.github.io
  branch: main
  base_url: https://candidduo-cms-auth.thecandiduo2.workers.dev

# Where images you upload in the CMS are stored
media_folder: "assets/images/uploads"
public_folder: "/assets/images/uploads"

# Nice touches for the editor UI
site_url: https://thecandidduo.github.io
logo_url: https://thecandidduo.github.io/assets/images/favicon.svg
publish_mode: simple

collections:
  # ---------------- STORIES (blog posts) ----------------
  - name: posts
    label: "Story"
    label_singular: "Story"
    description: "Your blog posts. Create, edit and publish from here."
    folder: "_posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    preview_path: "stories/{{slug}}"
    sortable_fields: [date, title]
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Publish date", name: "date", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false}
      - {label: "Category", name: "category", widget: "select", options: ["Culture", "Adventure", "Guide", "Food", "Reflection"], default: "Culture"}
      - {label: "Destination", name: "destination", widget: "select", options: ["Jeju", "New Zealand", "Tasmania", "Umroh", "Singapore", "Other"], required: false}
      - {label: "Cover image", name: "image", widget: "image", required: false, hint: "Best size ~1600×900px."}
      - {label: "Cover image alt text", name: "image_alt", widget: "string", required: false, hint: "Describe the photo for accessibility & SEO."}
      - {label: "Subtitle (dek)", name: "dek", widget: "string", required: false, hint: "The italic line under the title."}
      - {label: "Short summary", name: "excerpt", widget: "text", required: false, hint: "1–2 sentences. Shown on cards and in Google results."}
      - {label: "Tags", name: "tags", widget: "list", required: false, hint: "Press enter between tags."}
      - {label: "Feature on homepage", name: "featured", widget: "boolean", default: false, required: false, hint: "Turn on for ONE story to make it the big feature."}
      - {label: "Body", name: "body", widget: "markdown"}

  # ---------------- PRODUCTS (affiliate picks) ----------------
  - name: products
    label: "Product"
    label_singular: "Product"
    description: "Your affiliate product recommendations (Shop Our Faves)."
    folder: "_products"
    create: true
    slug: "{{slug}}"
    sortable_fields: [date, name, category]
    fields:
      - {label: "Product name", name: "name", widget: "string"}
      - {label: "Photo", name: "image", widget: "image", hint: "Square works best (about 800×800)."}
      - {label: "Price", name: "price", widget: "string", hint: "Include the currency, e.g. SGD 39"}
      - {label: "Buy on (platform)", name: "platform", widget: "select", options: ["Shopee", "Amazon", "Lazada", "TikTok Shop", "Etsy", "Other"]}
      - {label: "Available in (country)", name: "country", widget: "string", hint: "e.g. Singapore, or Singapore & Indonesia"}
      - {label: "Category", name: "category", widget: "string", hint: "e.g. Camera Gear, Travel Essentials, Tech, Skincare. This becomes a filter button on the Products page — reuse the same wording to group items together."}
      - {label: "Affiliate link", name: "url", widget: "string", hint: "Paste your full affiliate URL."}
      - {label: "Short note", name: "blurb", widget: "text", required: false}
      - {label: "Feature on homepage", name: "featured", widget: "boolean", default: false, required: false, hint: "Shows in ‘Our Recent Fav Products’ on the homepage."}
      - {label: "Date added", name: "date", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false}
      - {label: "Details (optional)", name: "body", widget: "markdown", required: false}

  # ---------------- HOMEPAGE ----------------
  - name: homepage
    label: "Homepage"
    description: "The hero carousel, the scrolling ticker, and the Watch & Listen cards."
    editor: {preview: false}
    files:
      - label: "Homepage sections"
        name: "homepage"
        file: "_data/homepage.yml"
        fields:
          - label: "Hero slides"
            name: "hero"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - {label: "Background image", name: "image", widget: "image"}
              - {label: "Eyebrow (small label)", name: "eyebrow", widget: "string"}
              - {label: "Title", name: "title", widget: "string"}
              - {label: "Subtitle", name: "subtitle", widget: "text"}
              - {label: "Button text", name: "cta_text", widget: "string", required: false}
              - {label: "Button link", name: "cta_url", widget: "string", required: false}
          - label: "Ticker items"
            name: "ticker"
            widget: "list"
            summary: "{{fields.kind}} — {{fields.label}}"
            fields:
              - {label: "Kind", name: "kind", widget: "select", options: ["WATCH", "LISTEN", "READ"]}
              - {label: "Label", name: "label", widget: "string"}
              - {label: "Link", name: "url", widget: "string", required: false}
          - label: "Watch & Listen cards"
            name: "media_features"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - {label: "Platform", name: "platform", widget: "select", options: ["youtube", "spotify", "tiktok"]}
              - {label: "Badge label", name: "label", widget: "string"}
              - {label: "Title", name: "title", widget: "string"}
              - {label: "Blurb", name: "blurb", widget: "text"}
              - {label: "Link", name: "url", widget: "string", required: false}
              - {label: "Image", name: "image", widget: "image"}

  # ---------------- PAGES ----------------
  - name: pages
    label: "Pages"
    description: "Your About, Work With Us and Privacy pages."
    files:
      - label: "About Us"
        name: "about"
        file: "about.md"
        fields:
          - {label: "Title", name: "title", widget: "string"}
          - {label: "Eyebrow", name: "eyebrow", widget: "string", required: false}
          - {label: "Lead (intro line)", name: "lead", widget: "text", required: false}
          - {label: "SEO description", name: "description", widget: "text", required: false}
          - {label: "Body", name: "body", widget: "markdown"}
          - {label: "Layout", name: "layout", widget: "hidden", default: "page"}
          - {label: "Permalink", name: "permalink", widget: "hidden", default: "/about/"}
      - label: "Work With Us"
        name: "contact"
        file: "contact.md"
        fields:
          - {label: "Title", name: "title", widget: "string"}
          - {label: "Eyebrow", name: "eyebrow", widget: "string", required: false}
          - {label: "Lead (intro line)", name: "lead", widget: "text", required: false}
          - {label: "SEO description", name: "description", widget: "text", required: false}
          - {label: "Body", name: "body", widget: "markdown"}
          - {label: "Layout", name: "layout", widget: "hidden", default: "page"}
          - {label: "Permalink", name: "permalink", widget: "hidden", default: "/contact/"}
      - label: "Privacy & Cookies"
        name: "privacy"
        file: "privacy.md"
        fields:
          - {label: "Title", name: "title", widget: "string"}
          - {label: "Eyebrow", name: "eyebrow", widget: "string", required: false}
          - {label: "Lead (intro line)", name: "lead", widget: "text", required: false}
          - {label: "SEO description", name: "description", widget: "text", required: false}
          - {label: "Body", name: "body", widget: "markdown"}
          - {label: "Layout", name: "layout", widget: "hidden", default: "page"}
          - {label: "Permalink", name: "permalink", widget: "hidden", default: "/privacy/"}

  # ---------------- NAVIGATION ----------------
  - name: navigation
    label: "Navigation"
    description: "The links in the top menu."
    editor: {preview: false}
    files:
      - label: "Main menu"
        name: "main"
        file: "_data/navigation.yml"
        fields:
          - label: "Menu links"
            name: "main"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - {label: "Label", name: "title", widget: "string"}
              - {label: "Link", name: "url", widget: "string"}
